/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenLocal()
}

dependencies {
    compileOnly 'com.majinnaibu.minecraft.plugins:ScoreKeeper:0.2.2-SNAPSHOT'
    compileOnly 'io.papermc.paper:paper-api:1.21.7-R0.1-SNAPSHOT'

    testImplementation libs.junit.junit
}


group = 'com.majinnaibu.minecraft.plugins'
version = '0.2.1-SNAPSHOT'
description = 'MobScores'

java {
    toolchain {
        // Paper 26.1+ requires Java 25.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('wrapper') {
    gradleVersion = '9.8.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionBase = Wrapper.PathBase.PROJECT
    distributionPath = '.gradle/wrapper/dists'
    archiveBase = Wrapper.PathBase.PROJECT
    archivePath = '.gradle/wrapper/dists'
}

tasks.named('updateDaemonJvm') {
    languageVersion = JavaLanguageVersion.of(25)
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // options.compilerArgs << "-Xlint:deprecation"
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    filesMatching('plugin.yml') {
        expand(project.properties)
    }
}
