/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'com.diffplug.spotless' version '8.10.3'
    id 'java-library'
    id 'maven-publish'
    id 'org.danilopianini.git-sensitive-semantic-versioning' version '7.0.24'
}

gitSemVer {
    minimumVersion.set('0.2.1')
    versionPrefix.set('v')
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }

    // Modrinth Maven repository for ScoreKeeper
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    mavenLocal()
}

dependencies {
    // Group is always 'maven.modrinth', module is your project slug/id
    compileOnly 'maven.modrinth:scorekeeper:0.2.2'
    compileOnly 'io.papermc.paper:paper-api:26.2.build.129-stable'

    testImplementation libs.junit.junit
}

group = 'com.majinnaibu.minecraft.plugins'
description = 'MobScores'

java {
    toolchain {
        // Paper 26.1+ requires Java 25.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('wrapper') {
    gradleVersion = '9.8.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionBase = Wrapper.PathBase.PROJECT
    distributionPath = '.gradle/wrapper/dists'
    archiveBase = Wrapper.PathBase.PROJECT
    archivePath = '.gradle/wrapper/dists'
}

tasks.named('updateDaemonJvm') {
    languageVersion = JavaLanguageVersion.of(25)
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // options.compilerArgs << "-Xlint:deprecation"
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

def pluginVersion = project.version.toString()

processResources {
    inputs.property "version", pluginVersion
    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
}

spotless {
    java {
        googleJavaFormat('1.36.1')
        importOrder 'java', 'javax', 'com', 'net', 'org', ''
        licenseHeaderFile 'config/license-header.txt'
        target 'src/**/*.java'
        removeUnusedImports()
        toggleOffOn()
    }
}
